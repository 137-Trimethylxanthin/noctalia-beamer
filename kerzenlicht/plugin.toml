# Kerzenlicht — candlelight: a soft white glow that follows your cursor.
#
#   watch     [[service]]   runs the overlay (lib/kerzenlicht.py, through uv) and
#                           keeps an eye on it
#   toggle    [[shortcut]]  control-center tile: flashlight on / off

id           = "137-trimethylxanthin/kerzenlicht"
name         = "Kerzenlicht"
version      = "0.1.0"
plugin_api   = 24   # argv form of runAsync; also brings module-require and service-lifecycle
author       = "137-trimethylxanthin"
license      = "MIT"
icon         = "bulb"
deprecated   = false
description  = "A spotlight for your cursor: a soft white glow follows it across every monitor, click-through. Any compositor with layer-shell and cursor sessions."
tags         = ["shortcut", "service", "focus", "fun"]
dependencies = ["uv", "pkill", "pgrep"]

[[setting]]
key             = "radius"
type            = "int"
label_key       = "settings.radius.label"
description_key = "settings.radius.description"
default         = 30
min             = 5
max             = 400

[[setting]]
key             = "softness"
type            = "int"
label_key       = "settings.softness.label"
description_key = "settings.softness.description"
default         = 15
min             = 0
max             = 300

[[setting]]
key             = "brightness"
type            = "double"
label_key       = "settings.brightness.label"
description_key = "settings.brightness.description"
default         = 0.6
min             = 0.1
max             = 1.0

[[setting]]
key             = "also_dnd"
type            = "bool"
label_key       = "settings.also_dnd.label"
description_key = "settings.also_dnd.description"
default         = false

[[service]]
id    = "watch"
entry = "watch.luau"

[[shortcut]]
id    = "toggle"
entry = "shortcut.luau"
